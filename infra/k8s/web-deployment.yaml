apiVersion: apps/v1
kind: Deployment
metadata:
  name: mop-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mop-web
  template:
    metadata:
      labels:
        app: mop-web
    spec:
      containers:
        - name: web
          image: mop-web:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: https://api.example.com/api/v1
