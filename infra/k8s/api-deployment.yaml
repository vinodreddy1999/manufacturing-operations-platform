apiVersion: apps/v1
kind: Deployment
metadata:
  name: mop-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mop-api
  template:
    metadata:
      labels:
        app: mop-api
    spec:
      containers:
        - name: api
          image: mop-api:latest
          ports:
            - containerPort: 4000
          envFrom:
            - secretRef:
                name: mop-api-secrets
