apiVersion: apps/v1
kind: Deployment
metadata:
  name: metam-fullstack
spec:
  replicas: 2
  selector:
    matchLabels:
      app: metam-fullstack
  template:
    metadata:
      labels:
        app: metam-fullstack
    spec:
      containers:
        - name: metam-fullstack
          image: vinodreddy1999/metam-services-fullstack:0.2.1
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: metam-config
            - secretRef:
                name: metam-secrets
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /live
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
